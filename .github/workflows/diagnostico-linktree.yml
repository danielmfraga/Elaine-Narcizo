# TEMPORÁRIO — descobrir por que o Linktree responde 406 ao servidor do GitHub.
# Apagar depois do diagnóstico.
name: Diagnóstico Linktree (temporário)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  testa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Quem é este servidor?
        run: curl -s https://api.ipify.org; echo; curl -s https://ipinfo.io/org; echo

      - name: Variações de pedido ao Linktree
        run: |
          U=https://linktr.ee/elainenarcizo
          CH="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          t() { printf '%-46s ' "$1"; shift; curl -s -o /tmp/b.html -w '%{http_code}  %{size_download}B  ' "$@" "$U"; head -c 90 /tmp/b.html | tr '\n' ' '; echo; }
          t "A) curl sem nada"
          t "B) UA do robô"                          -A "Mozilla/5.0 (compatible; dancadestino-bot)"
          t "C) UA Chrome"                           -A "$CH"
          t "D) UA Chrome + Accept de navegador"     -A "$CH" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: pt-BR,pt;q=0.9,en;q=0.8"
          t "E) D + Sec-Fetch + Upgrade-Insecure"    -A "$CH" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: pt-BR,pt;q=0.9" -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Site: none" -H "Upgrade-Insecure-Requests: 1"
          t "F) E + --compressed"                    -A "$CH" --compressed -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: pt-BR,pt;q=0.9" -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Mode: navigate" -H "Upgrade-Insecure-Requests: 1"
          t "G) HTTP/1.1 forçado + Chrome"           --http1.1 -A "$CH" -H "Accept: text/html"
          echo "--- cabeçalhos da resposta (E) ---"
          curl -s -D - -o /dev/null -A "$CH" -H "Accept: text/html" "$U" | head -14
