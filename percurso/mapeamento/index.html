    <p>Este percurso é interativo e precisa de JavaScript para funcionar — ele guarda o que você escreve só no seu próprio aparelho.</p>
    <p style="margin-top:12px">Se preferir, dá para fazer só com papel e caneta: numa folha, escreva as perguntas “Para quem posso pedir R$ 500,00 emprestado? Com quem me sinto segura? Com quem posso conversar durante 4 horas seguidas? Para quem eu peço ajuda? Com quem sinto prazer? De quem eu cuido? Com quem aprendo? Quem aprende comigo?” e, para cada uma, anote quem ou o quê responde.</p>
